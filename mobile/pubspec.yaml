name: smriti_setu
description: "SmritiSetu — AI-Based Cognitive Gaming and Support for Elderly Dementia Patients in North Eastern Region."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <1.0.0'
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  audioplayers: ^6.0.0
  provider: ^6.1.2
  sqflite_common_ffi_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    - assets/images/faces/
    - assets/audio/prompts/
